{% load static %}
<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Admin sign in · Nainjyoti</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet"><link href="{% static 'admin/css/login.css' %}" rel="stylesheet"></head><body class="login-body"><div class="login-brand"><img src="{% static 'img/logo.png' %}" alt="Nainjyoti" class="brand-logo"><b>Nainjyoti</b></div><main class="login-card"><div class="eyebrow">SECURE ADMIN PORTAL</div><h1>Welcome back</h1><p>Sign in to manage marketplace operations.</p><form action="/api/admin/login" method="post"><div class="mb-3"><label class="form-label" for="email">Work email</label><input class="form-control" id="email" type="email" name="email" autocomplete="username" required placeholder="admin@marketplace.in"></div><div class="mb-3"><label class="form-label" for="password">Password</label><input class="form-control" id="password" type="password" name="password" autocomplete="current-password" required placeholder="Enter your password"></div><div class="d-flex justify-content-between align-items-center mb-4"><label class="remember"><input type="checkbox" name="remember"> Remember this device</label><a href="/forgot-password">Forgot password?</a></div><button class="btn btn-dark w-100" type="submit">Sign in securely <i class="fa-solid fa-arrow-right ms-2"></i></button></form><div class="login-note"><i class="fa-solid fa-shield-halved me-2"></i>Admin access is protected. Authentication is handled by the server.</div></main><footer class="login-footer">&copy; 2026 Nainjyoti · Designed &amp; Developed by <a href="https://www.brightcodess.com/" target="_blank" rel="noopener noreferrer" style="display:inline-flex; align-items:center; text-decoration:none; margin-left:4px;"><img src="{% static 'img/brightcode.png' %}" alt="Brightcode" style="height:15px; vertical-align:middle; display:inline-block;" onerror="this.style.display='none'; this.nextElementSibling.style.display='inline';"><span style="display:none; color:red; font-weight:700; font-family:sans-serif;">Brightcode</span></a></footer></body></html>
